<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Money</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght=400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <div class="logo-icon">
                <span class="currency-symbol dynamic-symbol-1">$</span>
                <span class="currency-symbol dynamic-symbol-2">€</span>
            </div>
            <h1>CONVERT <span>MONEY</span></h1>
        </div>

        <div class="converter-box">
            <div class="input-group">
                <label for="currency-from">Converter de</label>
                <select id="currency-from">
                    <option value="BRL">R$ Real Brasileiro</option>
                    <option value="USD">US$ Dólar Americano</option>
                    <option value="EUR">€ Euro</option>
                    <option value="GBP">£ Libra Esterlina</option>
                </select>
            </div>

            <div class="input-group">
                <label for="currency-to">Converter para</label>
                <select id="currency-to">
                    <option value="USD" selected>US$ Dólar Americano</option>
                    <option value="BRL">R$ Real Brasileiro</option>
                    <option value="EUR">€ Euro</option>
                    <option value="GBP">£ Libra Esterlina</option>
                </select>
            </div>

            <div class="input-group">
                <label for="amount">Valor</label>
                <input type="number" id="amount" placeholder="Digite o valor..." min="0" step="any">
            </div>

            <button id="convert-button">Converter</button>

            <div class="result-container">
                <div class="currency-display" id="display-from">
                    <img src="https://flagcdn.com/w80/br.png" alt="Bandeira Origem" class="flag" id="flag-from">
                    <p class="currency-name" id="name-from">Real</p>
                    <p class="currency-value" id="value-from">R$ 0,00</p>
                </div>

                <div class="arrow-down">↓</div>

                <div class="currency-display" id="display-to">
                    <img src="https://flagcdn.com/w80/us.png" alt="Bandeira Destino" class="flag" id="flag-to">
                    <p class="currency-name" id="name-to">Dólar Americano</p>
                    <p class="currency-value" id="value-to">US$ 0,00</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
